<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  
  <style>
    @keyframes continuousGradientFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .bio-text-animated {
      font-family: monospace;
      font-size: 31px;
      font-weight: 500;
      line-height: 48px;
      margin: 0;
      padding: 0;
      display: inline;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc, #38bdf8);
      background-size: 600% 600%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: continuousGradientFlow 5s linear infinite;
    }
            
    @keyframes typeLine0 {
      from { width: 0px; }
      to { width: 721.5px; }
    }
    @keyframes blinkCursor0 {
      0%, 100% { border-right-color: #38bdf8; }
      50% { border-right-color: transparent; }
    }
    @keyframes hideCursor0 {
      to { border-right-color: transparent; }
    }

    .seq-line-0 {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      width: 0px;
      border-right: 4px solid transparent;
      animation: typeLine0 1.665s steps(37, end) 0s forwards,
                 blinkCursor0 0.5s step-end infinite 0s,
                 hideCursor0 0.01s 1.665s forwards;
    }
                
    @keyframes typeLine1 {
