<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="100%" height="100%">
  <style>
    
                        @keyframes fullAnim {
                            0% { opacity: 0.4; }
                            50% { opacity: 1; }
                            100% { opacity: 0.4; }
                        }
                        .animated-card { animation: fullAnim 3s ease-in-out infinite; }
                    
    @keyframes typing {
      from { width: 0; }
      to { width: 127.5px; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .typewriter-text {
      font-family: monospace;
      font-size: 14px;
      fill: #cbd5e1;
      overflow: hidden;
      white-space: nowrap;
      display: inline-block;
      animation: typing 2s steps(15, end) forwards;
    }
    .cursor-line {
      animation: blink 0.5s step-end 4, hideCursor 0.01s 2s forwards;
    }
    @keyframes hideCursor {
      to { visibility: hidden; }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #60a5fa;
    }
  </style>

  <g class="animated-card">
    <rect x="4" y="4" width="312" height="82" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Local Image Icon -->
    <image href="data:image/png;base64," x="18" y="28" width="34" height="34" preserveAspectRatio="xMidYMid meet"/>

    <!-- Title Element -->
    <text x="70" y="38" class="title-text">Website</text>
    
    <!-- Pure SVG Typewriter using foreignObject with explicit cursor element control -->
    <foreignObject x="70" y="47" width="230" height="25">
      <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center;">
        <span class="typewriter-text">alamindev27.com</span><span class="cursor-line" style="display: inline-block; width: 2px; height: 16px; background-color: #cbd5e1; margin-left: 1px;"></span>
      </div>
    </foreignObject>
  </g>
</svg>