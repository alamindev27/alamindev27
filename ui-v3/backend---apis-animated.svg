<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 180" width="100%" height="100%">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  
  <style>
    @keyframes continuousGradientFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    
                    @keyframes zoomInOut {
                        0%, 100% { transform: scale(0.97); }
                        50% { transform: scale(1.0); }
                    }
                    .animated-card-container { 
                        transform-origin: center; 
                        animation: zoomInOut 4s ease-in-out infinite; 
                    }
                

    .animated-gradient-text {
      background: linear-gradient(90deg, #60a5fa, #a855f7, #ec4899, #60a5fa);
      background-size: 600% 600%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: continuousGradientFlow 6s linear infinite;
    }

    /* Typewriter animation for title */
    @keyframes typeTitle {
      from { width: 0px; }
      to { width: 231px; }
    }
    @keyframes blinkCursor {
      0%, 100% { border-right-color: #60a5fa; }
      50% { border-right-color: transparent; }
    }
    @keyframes hideCursor {
      to { border-right-color: transparent; }
    }

    .typewriter-title {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      width: 0px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 25px;
      font-weight: 700;
      border-right: 3px solid transparent;
      animation: typeTitle 1.2s steps(14, end) 0.2s forwards,
                 blinkCursor 0.5s step-end infinite 0.2s,
                 hideCursor 0.01s 1.4s forwards;
    }

    /* Line-by-line fade-in effect */
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .desc-line {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 19px;
      line-height: 28px;
      color: #94a3b8;
      margin: 0;
      opacity: 0;
      animation: fadeInSlide 0.7s ease forwards;
    }
            
    .fade-line-0 { animation-delay: 1.45s; }
                
    .fade-line-1 { animation-delay: 1.63s; }
                
  </style>
  
  <g class="animated-card-container">
    <!-- Card Outer Box -->
    <rect x="4" y="4" width="712" height="172" rx="18" fill="#090d16" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Aligned Header with Base64 / SVG Icon + Title -->
    <foreignObject x="38" y="26" width="644" height="42">
      <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; gap: 14px; height: 100%;">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="url(#textGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
        <span class="typewriter-title animated-gradient-text">Backend &amp; APIs</span>
      </div>
    </foreignObject>

    <!-- Description Lines -->
    <foreignObject x="40" y="86" width="640" height="84">
      <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; flex-direction: column; gap: 2px;">
        <p class="desc-line fade-line-0">Scalable Node.js, RESTful &amp; mySql with</p><p class="desc-line fade-line-1">Laravel MVC.</p>
      </div>
    </foreignObject>
  </g>
</svg>