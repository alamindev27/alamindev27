<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="100%" height="100%">
  <style>
    
                        @keyframes fullAnim {
                            0% { opacity: 0.4; }
                            50% { opacity: 1; }
                            100% { opacity: 0.4; }
                        }
                        .animated-card { animation: fullAnim 3s ease-in-out infinite; }
                    
    .title-center {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #3bbaf6;
    }
  </style>

  <g class="animated-card">
    <rect x="4" y="4" width="312" height="82" rx="16" fill="#1e293b" stroke="#3bbaf6" stroke-width="2"/>
    
    <!-- Local Image Icon -->
    <image href="data:image/png;base64," x="25" y="28" width="34" height="34" preserveAspectRatio="xMidYMid meet"/>

    <!-- Centered Title Element -->
    <text x="80" y="50" class="title-center">Tailwind CSS</text>
  </g>
</svg>